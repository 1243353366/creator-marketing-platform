name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Deploy Worker and container image
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Set SECRET_KEY (fail-closed boot guard requires it)
        run: |
          openssl rand -hex 32 > /tmp/sk
          npx wrangler@latest secret put SECRET_KEY < /tmp/sk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Roll out with secret in place
        run: npx wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Diagnose failure
        if: failure()
        run: |
          echo "Deploy failed. Common causes seen in this pipeline:"
          echo "1. 'No access to the specified resource' -> API token lacks Workers edit"
          echo "   (create token from the 'Edit Cloudflare Workers' template)."
          echo "2. instance_type error -> allowed: lite/basic/standard-1..4/dev/standard."
          echo "3. npm ETARGET -> check package version in package.json."
          echo "Full wrangler logs are in the step output above."
